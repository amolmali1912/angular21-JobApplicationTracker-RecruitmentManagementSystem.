<div class="job-edit-page">
  <div class="page-header">
    <div>
      <h1>Edit Job</h1>
      <p>Update the details of this job.</p>
    </div>
  </div>

  <div class="job-form-card">
    @if (initialValue) {
      <app-job-form
        [initialValue]="initialValue"
        (formSubmitted)="onFormSubmitted($event)"
        (cancelled)="onCancel()"
      />
    }
  </div>
</div>
